[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-to-laa"
version = "0.1.0"
description = "Convert n8n workflow templates into Azure Logic Apps Automation templates."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vyom Nagrani" }]
dependencies = []

[project.scripts]
n8n-to-laa = "n8n_to_laa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

